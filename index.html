<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TN-CLEAN | Official</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: #090d16;
  color: white;
  font-family: Arial, sans-serif;
}

header {
  padding: 22px 7%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: #111827;
  border-bottom: 1px solid #263b5c;
}

.logo {
  color: #55aaff;
  font-size: 27px;
  font-weight: 900;
}

nav a {
  color: white;
  text-decoration: none;
  margin-left: 15px;
}

.hero {
  min-height: 78vh;
  padding: 70px 20px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  background: radial-gradient(circle, #19365d, #090d16 70%);
}

.hero h1 {
  font-size: clamp(55px, 12vw, 105px);
  font-weight: 900;
  letter-spacing: 5px;
}

.blue {
  color: #55aaff;
}

.hero p {
  color: #d1d9e8;
  margin: 20px 0;
  font-size: 18px;
}

.button {
  display: inline-block;
  background: #238cff;
  color: white;
  text-decoration: none;
  padding: 14px 28px;
  border-radius: 10px;
  font-weight: bold;
  transition: 0.3s;
}

.button:hover {
  background: #55aaff;
  transform: scale(1.05);
}
